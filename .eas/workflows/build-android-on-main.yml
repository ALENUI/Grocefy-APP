# Runs on Expo's servers (EAS Workflows): every push to main builds an installable Android APK.
# Requires the GitHub repo to be connected to the Expo project (expo.dev → Project settings → GitHub).
# The Supabase URL and public key come from the project's "preview" EAS environment variables.
name: Android APK on main

on:
  push:
    branches: ['main']

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview

  # Records the finished APK in Supabase (app_releases) so installed apps offer it as an update.
  # Needs RELEASE_PUBLISH_SECRET in the "preview" EAS environment, matching the Supabase secret of the same name.
  publish_release:
    name: Offer the APK to installed apps
    needs: [build_android]
    environment: preview
    env:
      BUILD_ID: ${{ needs.build_android.outputs.build_id }}
      BUILD_NUMBER: ${{ needs.build_android.outputs.app_build_version }}
      APP_VERSION: ${{ needs.build_android.outputs.app_version }}
    steps:
      - uses: eas/checkout
      - run: node scripts/publish-release.mjs
