name: CI

on:
  pull_request:
    branches: [Development, main]
  push:
    branches: [Development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and email tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:functions
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:email

  database:
    name: Database tests (RLS, transactions, finance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Uses Docker on the runner to start a disposable PostgreSQL 15; no npm dependencies are needed.
      - run: npm run test:db

  bundle:
    name: Bundle Android and iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Report-only: Expo ships patch releases often, and this check fails on any patch drift even when nothing in the
      # repo changed. Outdated packages show up in the log; run `npx expo install --fix` to update them.
      - name: Check Expo package versions (report only)
        run: npx expo install --check
        continue-on-error: true
      # The real gate: the app must bundle for both platforms.
      - run: npx expo export --platform android --platform ios --output-dir dist
        env: { CI: 1 }

  end-to-end:
    name: Service end-to-end (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      # Log provider and a throwaway worker secret for the send-emails function (see supabase/functions/.env.example).
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - run: supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Point the tests at the local stack
        run: |
          supabase status -o env | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/EXPO_PUBLIC_SUPABASE_URL=\1/p; s/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/EXPO_PUBLIC_SUPABASE_ANON_KEY=\1/p' >> "$GITHUB_ENV"
      - run: npm run test:services
      - if: always()
        run: supabase stop --no-backup
